# Testes de interface no navegador (celular e computador). Não bloqueia a publicação do site:
# se falhar, aparece em vermelho em Actions e o relatório fica salvo para consulta.
name: Testes de interface

on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', 'playwright.config.cjs', 'package.json', '.github/workflows/testes.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.grupo }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        grupo: [celular, computador]   # dois jobs em paralelo: a suíte inteira passa de 20 minutos em um só
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project='${{ matrix.grupo }}-*'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-dos-testes-${{ matrix.grupo }}
          path: test-results
          retention-days: 7
